- name: Add other rke2 control plane nodes
  hosts: "{{ groups['control_plane'][1:] }}"
  gather_facts: yes
  become: true
  tasks:
    - name: Create rke2 config file
      ansible.builtin.copy:
        dest: /etc/rancher/rke2/config.yaml
        content: |
          token: {{ rke2_shared_token }}
          server: https://{{ kube_vip }}:9345
          tls-san:
            - {{ kube_vip }}
            - {{ public_lb_fqdn }}
        owner: root
        group: root
        mode: '0644'
      become: true
    
    - name: Install rke2
      ansible.builtin.shell:
        cmd: curl -sfL https://get.rke2.io | INSTALL_RKE2_VERSION="{{ rke2_version }}" sh -
        creates: /etc/rancher/rke2/rke2.yaml
      become: true

    - name: Enable rke2 service
      ansible.builtin.systemd:
        state: started
        name: rke2-server
        daemon_reload: true
        enabled: true